spring:
  application:
    name: roster
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/roster?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
    username: ${DB_USER:roster}
    password: ${DB_PASSWORD:roster}
  jpa:
    hibernate:
      ddl-auto: none          # Flyway owns the schema
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Profile photos: accept the parse, then validate 2 MB in the service,
      # which gives a clean 400 instead of a container-level abort.
      max-file-size: 3MB
      max-request-size: 4MB

server:
  port: ${SERVER_PORT:8080}
  # Behind the production nginx proxy (docker-compose.prod.yml) the backend
  # must see the client's original scheme/host, otherwise Spring's CORS
  # processor treats every proxied same-origin POST as cross-origin. Only the
  # compose proxy sends X-Forwarded-*; elsewhere this is a no-op.
  forward-headers-strategy: framework

app:
  # Public origin of the frontend — invite links and checkout return URL.
  base-url: ${APP_BASE_URL:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-generate-a-real-one-32b}
    ttl-minutes: ${JWT_TTL_MINUTES:720}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  purge:
    initial-delay-ms: 15000
    interval-ms: 3600000
  digest:
    # Weekly digest job: one plain-text digest per active workspace, Mondays
    # at 08:00 server time; idempotent per ISO week. job-enabled=false keeps
    # tests off the schedule (they drive DigestService directly).
    cron: ${DIGEST_CRON:0 0 8 * * MON}
    job-enabled: ${DIGEST_JOB_ENABLED:true}
  engagement:
    # Nightly engagement snapshots + churn dashboard: window-days is the
    # trailing activity window, inactive-days the INACTIVE signal threshold,
    # drop-percent + min-previous-score the DROP signal (score fall vs the
    # previous snapshot, with a noise floor on the baseline). job-enabled=
    # false keeps tests off the schedule (they drive EngagementService
    # directly).
    cron: ${ENGAGEMENT_CRON:0 30 2 * * *}
    window-days: ${ENGAGEMENT_WINDOW_DAYS:30}
    inactive-days: ${ENGAGEMENT_INACTIVE_DAYS:14}
    drop-percent: ${ENGAGEMENT_DROP_PERCENT:50}
    min-previous-score: ${ENGAGEMENT_MIN_PREVIOUS_SCORE:12}
    job-enabled: ${ENGAGEMENT_JOB_ENABLED:true}
  discord:
    # OAuth "Login with Discord" (empty = endpoint answers 503).
    client-id: ${DISCORD_CLIENT_ID:}
    client-secret: ${DISCORD_CLIENT_SECRET:}
    redirect-uri: ${DISCORD_REDIRECT_URI:http://localhost:5173/auth/discord}
    # Bot token: role sync (guild member roles) + channel notifications.
    bot-token: ${DISCORD_BOT_TOKEN:}
    api-base: ${DISCORD_API_BASE:https://discord.com/api}
  billing:
    provider: ${BILLING_PROVIDER:stripe}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
      api-base: ${STRIPE_API_BASE:https://api.stripe.com}
    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}
      webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
