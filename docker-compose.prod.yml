# Production stack: MySQL 8 + Spring Boot backend + nginx-served frontend.
#
#   cp .env.example .env        # set JWT_SECRET, DB_PASSWORD,
#                               # MYSQL_ROOT_PASSWORD, APP_BASE_URL
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Design:
#   * Only the frontend (nginx) publishes a port (${HTTP_PORT:-80}:80).
#     The backend and MySQL live on the internal network — nothing else is
#     reachable from the host or the internet.
#   * nginx serves the built SPA and proxies /api to the backend, so the
#     browser stays on one origin (same pattern as the dev Vite proxy).
#   * MySQL data lives in a named volume; the backend runs Flyway on boot,
#     so schema setup/upgrade is just "recreate the backend container".
#   * dev docker-compose.yml is untouched — both stacks can run side by side
#     (different project name, volume and ports).

name: roster-prod

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-roster}
      MYSQL_USER: ${DB_USER:-roster}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    # No published port: only the backend on this network can reach it.
    networks: [roster]
    healthcheck:
      # $$ escapes compose interpolation so the shell sees the container's env.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Service name as the DB host — this URL must NOT point at localhost.
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-roster}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8
      DB_USER: ${DB_USER:-roster}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      # JWT signing key, >= 32 chars: openssl rand -base64 48
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (>= 32 characters)}
      JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-720}
      # Same-origin via nginx; the default only matters for extra origins.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SERVER_PORT: 8080
      # Public origin — invite links and the Stripe checkout return URL.
      # Set this to https://<your-domain> once the stack is on a real host.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
      # Optional integrations — left empty they answer 503 with a clear code
      # (checkout, Discord login); everything else works without them.
      BILLING_PROVIDER: ${BILLING_PROVIDER:-stripe}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:-http://localhost:5173/auth/discord}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [roster]
    # HEALTHCHECK comes from backend/Dockerfile (start period covers Flyway).

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [roster]
    healthcheck:
      # busybox wget ships with nginx:alpine.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mysql-data:

networks:
  roster:
    driver: bridge
