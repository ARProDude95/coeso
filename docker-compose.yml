services:
  mysql:
    image: mysql:8.0
    container_name: roster-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: roster
      MYSQL_USER: roster
      MYSQL_PASSWORD: roster
    ports:
      - "3306:3306"
    volumes:
      - roster-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  roster-mysql-data:
