# Production edge for the SPA: serves the built bundle and proxies /api to
# the backend service on the compose network. Same origin end-to-end — the
# browser never talks to :8080 directly, so CORS never applies to normal use
# (the backend additionally honours X-Forwarded-* to recognise the original
# scheme/host, see server.forward-headers-strategy in application.yml).

# Public edge (browser) ── https ──▶ Caddy ── http ──▶ this server.
# $scheme only sees OUR connection, so behind the TLS edge it would say
# "http" and Spring would treat every https same-origin POST as cross-origin
# (403 "Invalid CORS request"). Trust the edge's X-Forwarded-Proto — Caddy
# always sets it and ignores/overwrites client-supplied X-Forwarded-* (its
# default trusted_proxies behaviour) — and fall back to our own connection
# scheme when no edge is present (plain HTTP deploy, local test).
map $http_x_forwarded_proto $client_scheme {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;

    root  /usr/share/nginx/html;
    index index.html;

    # Profile photos are capped at 2 MB in the app; leave headroom for the
    # multipart envelope (nginx would otherwise cut requests at 1 MB).
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The app is a single page (BrowserRouter): unknown paths fall back to
    # index.html so deep links like /board survive a refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints the bundle names → cache hard, never the HTML shell.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API, auth and billing webhooks → backend container (URI passed
    # unchanged). X-Forwarded-* let Spring see the client's real scheme/host.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_scheme;
        proxy_set_header X-Forwarded-Port  $server_port;
        # CSV roster/payout exports can be slow on big workspaces.
        proxy_read_timeout 120s;
    }
}
